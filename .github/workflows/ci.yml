name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: church_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password123@localhost:5432/church_db?schema=public"
      AUTH_SECRET: "ci-secret-token-key-birhane-genet-test-32-chars"
      NEXTAUTH_SECRET: "ci-secret-token-key-birhane-genet-test-32-chars"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma schema to Postgres
        run: npx prisma db push --accept-data-loss

      - name: Seed database fixtures
        run: npm run db:seed

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run test suite
        run: npm run test

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
