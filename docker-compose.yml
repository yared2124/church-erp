services:
  postgres:
    image: postgres:16-alpine
    container_name: church-erp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "212121"
      POSTGRES_DB: church_db
    volumes:
      - church_erp_pgdata:/var/lib/postgresql/data

volumes:
  church_erp_pgdata:
