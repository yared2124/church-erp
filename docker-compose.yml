version: '3.8'

services:
  # ============================================================
  # 1. PostgreSQL Database Service
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: church-erp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "212121"
      POSTGRES_DB: church_db
    volumes:
      - church_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d church_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - church_erp_net

  # ============================================================
  # 2. NestJS Enterprise REST API Service
  # ============================================================
  backend:
    container_name: church-erp-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:212121@postgres:5432/church_db?schema=public"
      JWT_SECRET: "church-erp-enterprise-jwt-token-secret-birhane-genet-2026"
      JWT_EXPIRES_IN: "7d"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./prisma:/app/prisma
      - backend_node_modules:/app/node_modules
    networks:
      - church_erp_net

  # ============================================================
  # 3. Next.js Frontend Web Application
  # ============================================================
  frontend:
    container_name: church-erp-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:212121@postgres:5432/church_db?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "church-erp-enterprise-jwt-token-secret-birhane-genet-2026"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.next
      - frontend_node_modules:/app/node_modules
    networks:
      - church_erp_net

volumes:
  church_erp_pgdata:
  backend_node_modules:
  frontend_node_modules:

networks:
  church_erp_net:
    driver: bridge
